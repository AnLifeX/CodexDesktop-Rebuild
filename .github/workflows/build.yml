name: Build & Release Windows (Manual)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a codex-win-* GitHub Release"
        required: false
        default: true
        type: boolean
      publish_update_feed:
        description: "When publishing a Release, also deploy RELEASES and nupkg to the Windows update feed"
        required: false
        default: true
        type: boolean
      skip_windows_delta:
        description: "Build full Windows packages only, without delta packages"
        required: false
        default: false
        type: boolean
      replace_existing_release:
        description: "Replace assets and retarget the existing release for the same Windows version"
        required: false
        default: false
        type: boolean
      release_version_override:
        description: "Optional exact X.Y.Z-rN release version (used with same-version replacement)"
        required: false
        default: ""
        type: string
      rebuild_revision:
        description: "Optional rN revision for another rebuild of the same official Windows version"
        required: false
        default: ""
        type: string

env:
  NODE_VERSION: "24"
  WINDOWS_UPDATE_TAG: "windows-update-feed"
  WINDOWS_UPDATE_FEED: "https://github.com/Gaq152/CodexDesktop-Rebuild/releases/download/windows-update-feed"

permissions:
  contents: read

concurrency:
  group: codex-windows-release-state
  cancel-in-progress: false

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    outputs:
      windows_upstream_version: ${{ steps.windows_version.outputs.windows_upstream_version }}
      windows_internal_app_version: ${{ steps.windows_version.outputs.windows_internal_app_version }}
      windows_codex_cli_version: ${{ steps.codex_cli.outputs.codex_cli_version }}
      windows_rebuild_revision: ${{ steps.windows_version.outputs.windows_rebuild_revision }}
      windows_release_version: ${{ steps.windows_version.outputs.windows_release_version }}
      windows_package_version: ${{ steps.windows_version.outputs.windows_package_version }}
      windows_portable_version: ${{ steps.windows_artifacts.outputs.windows_portable_version }}
      windows_installer_version: ${{ steps.windows_artifacts.outputs.windows_installer_version }}
      windows_release_tag: codex-win-${{ steps.windows_artifacts.outputs.windows_installer_version }}
      windows_feed_staging_tag: windows-update-feed-staging-${{ steps.windows_artifacts.outputs.windows_installer_version }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate replacement inputs
        shell: pwsh
        env:
          REPLACE_EXISTING_RELEASE: ${{ inputs.replace_existing_release }}
          RELEASE_VERSION_OVERRIDE: ${{ inputs.release_version_override }}
          REBUILD_REVISION: ${{ inputs.rebuild_revision }}
        run: |
          $replace = ([string]$env:REPLACE_EXISTING_RELEASE).ToLowerInvariant() -eq "true"
          $override = ([string]$env:RELEASE_VERSION_OVERRIDE).Trim()
          $revision = ([string]$env:REBUILD_REVISION).Trim()
          if ($replace -and -not $override) {
            throw "replace_existing_release requires an exact release_version_override"
          }
          if (-not $replace -and $override) {
            throw "release_version_override is only allowed with replace_existing_release"
          }
          if ($override -and $override -notmatch '^\d+\.\d+\.\d+(?:-r[1-9]\d*)?$') {
            throw "release_version_override must be X.Y.Z or X.Y.Z-rN"
          }
          if ($revision -and $revision -notmatch '^[1-9]\d*$') {
            throw "rebuild_revision must be a positive integer"
          }
          if ($replace -and $revision) {
            throw "rebuild_revision is not used when replacing an existing release"
          }
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: choco install 7zip -y
      - name: Add 7zz alias
        run: |
          Copy-Item "C:\Program Files\7-Zip\7z.exe" "C:\Program Files\7-Zip\7zz.exe"
          echo "C:\Program Files\7-Zip" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Sync upstream Windows package
        run: node scripts/sync-upstream.js --force --skip-mac

      - name: Match official Codex CLI runtime
        id: codex_cli
        shell: pwsh
        run: |
          node scripts/configure-codex-cli-version.js `
            --binary src/win/codex.exe `
            --write-package package.json `
            --github-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $codexCliVersion = node -p "require('./package.json').optionalDependencies['@openai/codex']"
          npm install --ignore-scripts --no-audit --no-fund --save-optional --save-exact "@openai/codex@$codexCliVersion"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve actual Windows release version
        id: windows_version
        shell: pwsh
        env:
          RELEASE_VERSION_OVERRIDE: ${{ inputs.release_version_override }}
          REBUILD_REVISION: ${{ inputs.rebuild_revision }}
        run: |
          $args = @(
            "scripts/configure-windows-release-version.js",
            "--previous", "scripts/upstream-versions.json",
            "--write-package", "package.json",
            "--write-package", "src/win/_asar/package.json",
            "--github-output"
          )
          $override = ([string]$env:RELEASE_VERSION_OVERRIDE).Trim()
          if ($override) {
            $args += @("--release-version", $override)
          }
          $revision = ([string]$env:REBUILD_REVISION).Trim()
          if ($revision) {
            $args += @("--rebuild-revision", $revision)
          }
          & node @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Windows update feed
        shell: pwsh
        run: |
          $feed = "${{ env.WINDOWS_UPDATE_FEED }}"
          $version = "${{ steps.windows_version.outputs.windows_package_version }}"
          "CODEX_REBUILD_UPDATE_URL=$feed" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CODEX_REBUILD_REMOTE_RELEASES=$feed" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CODEX_REBUILD_INSTALLER_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "Windows MSIX: ${{ steps.windows_version.outputs.windows_upstream_version }}"
          Write-Host "Windows official app: ${{ steps.windows_version.outputs.windows_internal_app_version }}"
          Write-Host "Official Codex CLI: ${{ steps.codex_cli.outputs.codex_cli_version }}"
          Write-Host "Windows public release: ${{ steps.windows_version.outputs.windows_release_version }}"
          Write-Host "Windows Squirrel package: $version"

      - run: node scripts/patch-all.js win
      - run: npm run build:win-x64

      - name: Build full-only Windows installer
        if: inputs.skip_windows_delta == true
        timeout-minutes: 30
        env:
          CODEX_REBUILD_NO_DELTA: "1"
          DEBUG: electron-windows-installer:*
        run: npm run build:win-installer

      - name: Build Windows installer with required delta
        id: windows_delta
        if: inputs.skip_windows_delta != true
        timeout-minutes: 60
        env:
          DEBUG: electron-windows-installer:*
        run: npm run build:win-installer

      - name: Verify required Windows delta package
        if: inputs.skip_windows_delta != true
        env:
          EXPECTED_VERSION: ${{ steps.windows_version.outputs.windows_package_version }}
        shell: pwsh
        run: |
          $output = Join-Path $PWD.Path "out/make/squirrel.windows/x64"
          if (-not (Test-Path -LiteralPath $output -PathType Container)) {
            throw "Windows installer output is missing: $output"
          }
          $fullName = "Codex-$($env:EXPECTED_VERSION)-full.nupkg"
          $deltaName = "Codex-$($env:EXPECTED_VERSION)-delta.nupkg"
          foreach ($name in @($fullName, $deltaName, "RELEASES")) {
            $file = Join-Path $output $name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required Windows update artifact is missing: $file"
            }
          }
          $referenced = Get-Content -LiteralPath (Join-Path $output "RELEASES") |
            ForEach-Object { ($_ -split '\s+')[1] }
          foreach ($name in @($fullName, $deltaName)) {
            if ($name -notin $referenced) {
              throw "RELEASES does not reference required package: $name"
            }
          }
          Write-Host "Required delta package generated: $deltaName"
          Get-ChildItem -LiteralPath $output -File |
            Where-Object { $_.Extension -in '.exe', '.nupkg' -or $_.Name -eq 'RELEASES' } |
            Sort-Object Name |
            ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }

      - name: Resolve Windows artifact versions
        id: windows_artifacts
        run: node scripts/resolve-release-artifacts.js --root out --rename-windows-setup --package-version "${{ steps.windows_version.outputs.windows_package_version }}" --release-version "${{ steps.windows_version.outputs.windows_release_version }}" --github-output

      - name: Package Windows installer zip
        shell: pwsh
        run: |
          $version = "${{ steps.windows_artifacts.outputs.windows_installer_version }}"
          $sourceDir = Join-Path $PWD.Path "out/make/squirrel.windows/x64"
          $exe = Join-Path $sourceDir "CodexSetup-win-x64-$version.exe"
          $zip = Join-Path $PWD.Path "out/CodexSetup-win-x64-$version.zip"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Renamed Windows installer is missing: $exe"
          }
          Push-Location $sourceDir
          try {
            & 7zz a -tzip -mx=1 $zip (Split-Path -Leaf $exe)
            if ($LASTEXITCODE -ne 0) { throw "7zz failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Windows installer zip was not created: $zip"
          }

      - name: Prepare Windows update feed artifact
        shell: pwsh
        run: |
          $previousManifest = Join-Path $env:RUNNER_TEMP "previous-delta-chain.json"
          $status = curl.exe --silent --show-error --location `
            --output $previousManifest `
            --write-out "%{http_code}" `
            "${{ env.WINDOWS_UPDATE_FEED }}/delta-chain.json?build=${{ github.run_id }}-${{ github.run_attempt }}"
          $args = @(
            "scripts/prepare-windows-update-feed.js",
            "--source", "out/make/squirrel.windows/x64",
            "--dest", "out/update-feed"
          )
          if ($status -eq "200") {
            $args += @("--previous-manifest", $previousManifest)
          } elseif ($status -ne "404") {
            throw "Unable to read previous delta chain manifest: HTTP $status"
          }
          & node @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Windows update feed artifact
        run: node scripts/validate-windows-release-feed.js --root out/update-feed --version "${{ steps.windows_artifacts.outputs.windows_package_version }}"

      - name: Write Windows release metadata
        shell: pwsh
        run: |
          $release = "${{ steps.windows_version.outputs.windows_release_version }}"
          $args = @(
            "scripts/windows-release-metadata.js",
            "--write", "out/windows-release-metadata.json",
            "--upstream-version", "${{ steps.windows_version.outputs.windows_upstream_version }}",
            "--internal-version", "${{ steps.windows_version.outputs.windows_internal_app_version }}",
            "--release-version", $release,
            "--source-sha", "${{ github.sha }}"
          )
          $replacement = ([string]"${{ inputs.replace_existing_release }}").ToLowerInvariant() -eq "true"
          if ($replacement -and $release -match '^\d+\.\d+\.\d+$') {
            $args += "--allow-legacy-release"
          }
          & node @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows assets to draft release
        if: inputs.replace_existing_release != true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: codex-win-${{ steps.windows_artifacts.outputs.windows_installer_version }}
          name: Codex Win ${{ steps.windows_artifacts.outputs.windows_installer_version }}
          target_commitish: master
          body: |
            Windows-only rebuild from official Codex `${{ steps.windows_version.outputs.windows_internal_app_version }}` (MSIX `${{ steps.windows_version.outputs.windows_upstream_version }}`).
            - Bundled Codex CLI: `${{ steps.codex_cli.outputs.codex_cli_version }}` (matched from the official MSIX).
            - Portable: `Codex-win-x64-${{ steps.windows_artifacts.outputs.windows_portable_version }}.zip`
            - Installer: `CodexSetup-win-x64-${{ steps.windows_artifacts.outputs.windows_installer_version }}.zip`
            - The installer executable is inside the ZIP to avoid direct `.exe` browser download blocking.
            - Squirrel update packages are published separately to `windows-update-feed`.
            - This release remains a draft until all validation and feed publication steps succeed.
          files: |
            out/Codex-win-x64-${{ steps.windows_artifacts.outputs.windows_portable_version }}.zip
            out/CodexSetup-win-x64-${{ steps.windows_artifacts.outputs.windows_installer_version }}.zip
            out/windows-release-metadata.json
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: true
          prerelease: false
          make_latest: false

      - name: Upload replacement Windows assets
        if: inputs.replace_existing_release == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: codex-win-${{ steps.windows_artifacts.outputs.windows_installer_version }}
          PORTABLE: out/Codex-win-x64-${{ steps.windows_artifacts.outputs.windows_portable_version }}.zip
          INSTALLER: out/CodexSetup-win-x64-${{ steps.windows_artifacts.outputs.windows_installer_version }}.zip
        run: |
          gh release upload $env:RELEASE_TAG $env:PORTABLE $env:INSTALLER --clobber

      - name: Upload Windows update feed to draft staging release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: windows-update-feed-staging-${{ steps.windows_artifacts.outputs.windows_installer_version }}
          name: Windows update feed staging ${{ steps.windows_artifacts.outputs.windows_installer_version }}
          target_commitish: master
          body: |
            Temporary staging assets for the Windows `windows-update-feed` release.
            This draft is deleted after the corresponding public Windows release is finalized.
          files: out/update-feed/*
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: true
          prerelease: false
          make_latest: false

  release:
    needs: [build-windows]
    if: needs.build-windows.result == 'success' && inputs.publish_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Download draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-windows.outputs.windows_release_tag }}
          FEED_STAGING_TAG: ${{ needs.build-windows.outputs.windows_feed_staging_tag }}
          REPLACE_EXISTING_RELEASE: ${{ inputs.replace_existing_release }}
        run: |
          set -euo pipefail
          mkdir -p artifacts update-feed
          gh release download "$RELEASE_TAG" \
            --dir artifacts \
            --pattern '*.zip' \
            --pattern 'windows-release-metadata.json' \
            --clobber
          gh release download "$FEED_STAGING_TAG" \
            --dir update-feed \
            --pattern '*.nupkg' \
            --pattern 'RELEASES' \
            --pattern 'delta-chain.json' \
            --clobber
          if [ ! -f artifacts/windows-release-metadata.json ]; then
            node scripts/windows-release-metadata.js \
              --write artifacts/windows-release-metadata.json \
              --upstream-version "${{ needs.build-windows.outputs.windows_upstream_version }}" \
              --internal-version "${{ needs.build-windows.outputs.windows_internal_app_version }}" \
              --release-version "${{ needs.build-windows.outputs.windows_release_version }}" \
              --source-sha "$GITHUB_SHA"
          fi

          release_json="$(gh release view "$RELEASE_TAG" --json isDraft,assets)"
          feed_json="$(gh release view "$FEED_STAGING_TAG" --json isDraft,assets)"
          if [[ "$REPLACE_EXISTING_RELEASE" != "true" ]]; then
            test "$(jq -r '.isDraft' <<<"$release_json")" = true
          fi
          test "$(jq -r '.isDraft' <<<"$feed_json")" = true
          printf '%s\n' "$release_json" | jq -r '.assets[].name' | sort
          printf '%s\n' "$feed_json" | jq -r '.assets[].name' | sort

      - name: Validate release metadata and monotonic state
        env:
          EXPECTED_VERSION: ${{ needs.build-windows.outputs.windows_release_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          metadata_file="$(find artifacts -type f -name windows-release-metadata.json -print -quit)"
          local_releases="$(find update-feed -type f -name RELEASES -print -quit)"
          remote_releases="$(mktemp)"
          trap 'rm -f "$remote_releases"' EXIT
          status="$(curl --silent --show-error --location --output "$remote_releases" --write-out '%{http_code}' "${WINDOWS_UPDATE_FEED}/RELEASES?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")"
          case "$status" in
            200) ;;
            404) : > "$remote_releases" ;;
            *) echo "Unable to read current Windows update feed: HTTP $status" >&2; exit 1 ;;
          esac
          replacement_args=()
          if [[ "${{ inputs.replace_existing_release }}" == "true" ]]; then
            replacement_args+=(--allow-same-version-replacement)
          fi
          node scripts/windows-release-metadata.js \
            --metadata "$metadata_file" \
            --validate-promotion \
            --expected-release-version "$EXPECTED_VERSION" \
            --package package.json \
            --tracked scripts/upstream-versions.json \
            --local-releases "$local_releases" \
            --remote-releases "$remote_releases" \
            "${replacement_args[@]}"
          metadata_sha="$(node -e "console.log(require('./' + process.argv[1]).sourceSha)" "$metadata_file")"
          test "$metadata_sha" = "$GITHUB_SHA"
          if [[ "${{ inputs.replace_existing_release }}" == "true" ]]; then
            test "${{ inputs.release_version_override }}" = "$EXPECTED_VERSION"
            tag="codex-win-${EXPECTED_VERSION}"
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null
            gh release view "$tag" >/dev/null
          fi

      - name: Record built Windows versions
        env:
          WINDOWS_UPSTREAM_VERSION: ${{ needs.build-windows.outputs.windows_upstream_version }}
          WINDOWS_INTERNAL_APP_VERSION: ${{ needs.build-windows.outputs.windows_internal_app_version }}
          WINDOWS_CODEX_CLI_VERSION: ${{ needs.build-windows.outputs.windows_codex_cli_version }}
        run: |
          set -euo pipefail
          node scripts/configure-windows-release-version.js \
            --upstream-version "$WINDOWS_UPSTREAM_VERSION" \
            --internal-version "$WINDOWS_INTERNAL_APP_VERSION" \
            --release-version "${{ needs.build-windows.outputs.windows_release_version }}" \
            --write-package package.json \
            --write-tracked scripts/upstream-versions.json
          node scripts/configure-codex-cli-version.js \
            --version "$WINDOWS_CODEX_CLI_VERSION" \
            --write-package package.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund \
            --save-optional --save-exact "@openai/codex@$WINDOWS_CODEX_CLI_VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json scripts/upstream-versions.json
          if ! git diff --cached --quiet; then
            git commit -m "Bump Windows to $WINDOWS_UPSTREAM_VERSION and Codex CLI to $WINDOWS_CODEX_CLI_VERSION"
            git push origin HEAD
          else
            echo "No Windows version metadata change"
          fi

      - name: Resolve release artifact versions
        id: artifacts
        run: node scripts/resolve-release-artifacts.js --root artifacts --github-output

      - name: Resolve Windows full package version
        id: package_artifacts
        run: node scripts/resolve-release-artifacts.js --root update-feed --github-output

      - name: Validate exact Windows release assets
        env:
          EXPECTED_VERSION: ${{ needs.build-windows.outputs.windows_release_version }}
          EXPECTED_PACKAGE_VERSION: ${{ needs.build-windows.outputs.windows_package_version }}
          PORTABLE_VERSION: ${{ steps.artifacts.outputs.windows_portable_version }}
          INSTALLER_VERSION: ${{ steps.artifacts.outputs.windows_installer_version }}
          PACKAGE_VERSION: ${{ steps.package_artifacts.outputs.windows_package_version }}
        run: |
          set -euo pipefail
          test "$PORTABLE_VERSION" = "$EXPECTED_VERSION"
          test "$INSTALLER_VERSION" = "$EXPECTED_VERSION"
          test "$PACKAGE_VERSION" = "$EXPECTED_PACKAGE_VERSION"

      - name: Validate exact draft asset set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-windows.outputs.windows_release_tag }}
          RELEASE_VERSION: ${{ needs.build-windows.outputs.windows_release_version }}
        run: |
          set -euo pipefail
          desired_assets="$(mktemp)"
          actual_assets="$(mktemp)"
          trap 'rm -f "$desired_assets" "$actual_assets"' EXIT
          printf '%s\n' \
            "Codex-win-x64-${RELEASE_VERSION}.zip" \
            "CodexSetup-win-x64-${RELEASE_VERSION}.zip" \
            | sort > "$desired_assets"
          if [[ "${{ inputs.replace_existing_release }}" != "true" ]]; then
            printf '%s\n' "windows-release-metadata.json" >> "$desired_assets"
            sort -o "$desired_assets" "$desired_assets"
          fi
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > "$actual_assets"
          if ! cmp -s "$desired_assets" "$actual_assets"; then
            echo "Draft release asset set is not exact for $RELEASE_TAG" >&2
            diff -u "$desired_assets" "$actual_assets" >&2 || true
            exit 1
          fi

      - name: Publish Windows update feed
        if: inputs.publish_update_feed == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ env.WINDOWS_UPDATE_TAG }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Windows update feed" --notes "Squirrel.Windows update feed for CodexDesktop-Rebuild." --latest=false
          fi
          feed_dir="update-feed"
          desired_assets="$(mktemp)"
          (
            find "$feed_dir" -maxdepth 1 -type f -name '*.nupkg' -printf '%f\n'
            printf 'RELEASES\n'
            printf 'delta-chain.json\n'
          ) | sort > "$desired_assets"
          gh release upload "$tag" "$feed_dir"/*.nupkg --clobber
          gh release upload "$tag" "$feed_dir/RELEASES" --clobber
          gh release upload "$tag" "$feed_dir/delta-chain.json" --clobber
          gh release view "$tag" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            if ! grep -Fxq "$asset" "$desired_assets"; then
              gh release delete-asset "$tag" "$asset" -y
            fi
          done

      - name: Remove metadata asset before publication
        if: inputs.replace_existing_release != true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-windows.outputs.windows_release_tag }}
        run: |
          set -euo pipefail
          release_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq '.databaseId')"
          metadata_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate --jq '.[] | select(.name == "windows-release-metadata.json") | .id' | head -n 1)"
          test -n "$metadata_id"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$metadata_id"

      - name: Publish Windows draft release
        if: inputs.replace_existing_release != true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-windows.outputs.windows_release_tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Retarget replacement release tag
        if: inputs.replace_existing_release == true
        env:
          RELEASE_VERSION: ${{ needs.build-windows.outputs.windows_release_version }}
        run: |
          set -euo pipefail
          tag="codex-win-${RELEASE_VERSION}"
          git tag --force "$tag" HEAD
          git push origin "refs/tags/$tag" --force

      - name: Remove Windows update feed staging draft
        env:
          GH_TOKEN: ${{ github.token }}
          FEED_STAGING_TAG: ${{ needs.build-windows.outputs.windows_feed_staging_tag }}
        run: |
          set -euo pipefail
          staging_id="$(gh release view "$FEED_STAGING_TAG" --json databaseId --jq '.databaseId')"
          test -n "$staging_id"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$staging_id"
